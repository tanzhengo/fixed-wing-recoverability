model:
  CL:
    k1: 0.03
    k2: 0.028
  CD:
    k1: 0.001
    k2: 0.002
motion_primitive:
  horizon_time: 3.0
  V: 15.5
  theata: 45.0
  num: 29
  # Heading samples x altitude layers: up to 29 x 7 = 203 primitives.
  vertical_num: 7
  max_climb_angle: 20.0
  max_descent_angle: 20.0
  min_altitude: 1.0
  max_altitude: 80.0
  vertical_clearance: 1.0
  integration_dt: 0.02
  min_speed: 3.0
  max_speed: 45.0
  max_thrust: 20.0
  altitude_weight: 0.15
  distance_weight: 0.02
  heading_weight: 3.0
  waypoint_altitude_tolerance: 3.0
  max_roll_angle: 35.0
  max_attack_angle: 25.0
  # At cruise speed, level trim is below -10 degrees; allow descent as well.
  min_attack_angle: -20.0
  compensate_tau: 0.8
  K_T: 2.2

# Experimental finite-horizon continuation filter. Off preserves baseline mode.
# A passed sampled rollout is NOT an invariant safe set or a safety guarantee.
recovery:
  require_terminal: true
  stop_on_rejection: false
  # Zero leaves work bounded by the candidate-count limit.
  max_backup_integration_steps: 0
  enabled: false
  horizon_time: 3.0
  # At most this many feasible primaries, with <=15 backups per primary.
  max_candidates: 12
  # cost: original cheapest-first / first verified candidate (compatibility).
  # diverse: retain the cheapest, then cover distinct terminal heading/height
  # maneuvers; choose the cheapest verified member of that finite schedule.
  # Physical maneuver scales avoid exaggerating tiny height-band differences.
  candidate_order: cost
  # Optional shrinking execution witness. Only used after full revalidation from
  # the current state when the new library has no verified continuation.
  reuse_verified_plan: false
  # Reject cached front segments shorter than this actual control hold interval.
  # An update arriving later than this interval is not covered by this guard.
  min_execution_time: 0.1
  # 0 uses the configured map. Positive values freeze an idealized known-space
  # sphere at the current position for BOTH primary and continuation trajectories.
  # This does not model real camera FOV, visibility occlusions, or aircraft volume.
  known_space_radius: 0.0

# Optional trained continuation ranking; explicit validation remains unchanged.
# Set recovery/candidate_order to learned or learned_diverse and provide the
# exported model through recovery/model_path (terminal_recovery_learned.launch).
